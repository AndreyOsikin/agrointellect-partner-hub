<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>АГРОИНТЕЛЛЕКТ — Партнёрский кабинет</title>
<link rel="icon" type="image/png" sizes="32x32" href="./favicon.png?v=26">
<link rel="shortcut icon" href="./favicon.ico?v=26">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=26">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fa;font-family:Inter,"Segoe UI Variable Text","Segoe UI",Arial,sans-serif}
#appFrame{display:block;width:100%;height:100dvh;border:0;background:#f6f8fa;opacity:0;transition:opacity .18s ease}
#appFrame.ready{opacity:1}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#f6f8fa;z-index:2;transition:opacity .18s ease,visibility .18s ease}
#boot.hide{opacity:0;visibility:hidden;pointer-events:none}
.boot-card{display:flex;align-items:center;gap:14px;padding:18px 22px;border:1px solid #e2e8f0;border-radius:18px;background:#fff;box-shadow:0 14px 38px rgba(22,48,78,.07);color:#29445f}
.boot-card img{width:42px;height:42px;object-fit:contain;border-radius:10px}
.boot-copy strong{display:block;font-size:14px}.boot-copy span{display:block;margin-top:3px;font-size:12px;color:#718399}
</style>
</head>
<body>
<div id="boot"><div class="boot-card"><img src="assets/agrointellect-logo-tile.webp" alt="АГРОИНТЕЛЛЕКТ"><div class="boot-copy"><strong>Партнёрский кабинет</strong><span>Загружаем рабочее пространство…</span></div></div></div>
<iframe id="appFrame" src="legacy-v18.html" title="АГРОИНТЕЛЛЕКТ — Партнёрский кабинет" allow="clipboard-read; clipboard-write; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
(function(){
  const frame=document.getElementById('appFrame');
  const boot=document.getElementById('boot');
  function injectScript(doc,id,src){
    if(doc.getElementById(id))return;
    const s=doc.createElement('script');s.id=id;s.src=src;s.async=false;doc.head.appendChild(s);
  }
  function injectCss(doc,id,href){
    if(doc.getElementById(id))return;
    const link=doc.createElement('link');link.id=id;link.rel='stylesheet';link.href=href;doc.head.appendChild(link);
  }
  function applyTheme(){
    try{
      const doc=frame.contentDocument;
      if(!doc||!doc.head)return;
      injectCss(doc,'unified-v22-theme','assets/unified-v22.css?v=23');
      injectCss(doc,'contact-v24-theme','assets/contact-v24.css?v=24');
      injectScript(doc,'partner-hub-content-v24','assets/content-v24.js?v=24');
      injectScript(doc,'partner-hub-cms-loader','cms/cms-loader.js?v=2');
      injectScript(doc,'partner-hub-mobile-pdf-v25','assets/mobile-pdf-v25.js?v=25');
      injectScript(doc,'partner-hub-mobile-pdf-v26','assets/mobile-pdf-v26.js?v=26');
      doc.documentElement.dataset.partnerHubTheme='v26';
      frame.classList.add('ready');
      boot.classList.add('hide');
    }catch(err){
      console.warn('Theme/CMS injection fallback:',err);
      frame.classList.add('ready');
      boot.classList.add('hide');
    }
  }
  frame.addEventListener('load',applyTheme);
  setTimeout(()=>{frame.classList.add('ready');boot.classList.add('hide')},5000);
})();
</script>
</body>
</html>
